services:
  ubersdr_qsstv:
    image: madpsy/ubersdr_qsstv:latest
    container_name: sstv
    restart: unless-stopped
    cpu_shares: 512
    environment:
      # UberSDR base URL
      UBERSDR_URL: "http://ubersdr:8080"
      # Comma-separated freq:mode pairs.  Each pair is decoded concurrently by its
      # own decoder process, and the web UI shows a live channel rail when two or
      # more are configured, e.g. "14230000:usb,21335000:usb,7171000:lsb".
      # Note each channel opens its own audio session on the UberSDR receiver.
      # Defaults: 20m and 40m SSTV calling frequencies.
      # In Region 1 (Europe) 40m SSTV is often on 7165000 instead of 7171000.
      UBERSDR_CHANNELS: "14230000:usb,7171000:lsb"
      # Uncomment and set as needed:
      # UBERSDR_PASS: ""
      # OUTPUT_DIR: "/data"
      # WEB_PORT: "6091"
      # WEB_TLS: "0"
      # RECEIVER_LAT: "0.0"
      # RECEIVER_LON: "0.0"
      # CTY_FILE: ""
      # UI_PASSWORD: ""   # Set a password to enable write actions (delete, change URL).
                          # Leave empty (default) to disable all write actions.
      #
      # Multi-channel rail thumbnails.  Only produced while a browser is actually
      # watching, and skipped entirely when nobody is.  Lower the interval for a
      # smoother rail, raise it to cut bandwidth on a busy receiver.
      # RAIL_THUMB_INTERVAL_MS: "2000"   # Min ms between thumbnails, per channel
      # RAIL_THUMB_WIDTH: "160"          # Thumbnail width in pixels
      # RAIL_THUMB_QUALITY: "60"         # Thumbnail JPEG quality (1-100)
      #
      # Automatic cleanup — runs every 5 minutes.  Set any value to 0 to disable that job.
      CLEANUP_PARTIAL_DAYS: "1"    # Delete images where the signal was lost mid-frame
                                   # (fewer than 95% of lines decoded) after this many days.
                                   # These are the images hidden by the "Complete" gallery filter.
      CLEANUP_SNR_DAYS: "7"        # Delete images with average SNR below 38 dB after this many days.
                                   # These are the images hidden by the "≥38 dB" gallery filter.
      CLEANUP_ALL_DAYS: "30"       # Delete ALL images older than this many days, regardless of quality.
                                   # Acts as a general retention limit to keep disk usage bounded.
    networks:
      - sdr-network
    volumes:
      - ./sstv-images:/data
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: "sstv"

networks:
  sdr-network:
    external: true
    name: ubersdr_sdr-network
